name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - text-to-image-edit
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MIDTRANS_CLIENT_KEY: ${{ secrets.VITE_MIDTRANS_CLIENT_KEY }}
          VITE_MIDTRANS_SERVER_KEY: ${{ secrets.VITE_MIDTRANS_SERVER_KEY }}
          VITE_FAL_API_KEY: ${{ secrets.VITE_FAL_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
          VITE_LINKUP_API_KEY: ${{ secrets.VITE_LINKUP_API_KEY }}
          VITE_FIREWORKS_API_KEY: ${{ secrets.VITE_FIREWORKS_API_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_CLOUDFLARE_IMAGES_ACCOUNT_HASH: ${{ secrets.VITE_CLOUDFLARE_IMAGES_ACCOUNT_HASH }}
          VITE_CLOUDFLARE_STREAM_CUSTOMER_SUBDOMAIN: ${{ secrets.VITE_CLOUDFLARE_STREAM_CUSTOMER_SUBDOMAIN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
